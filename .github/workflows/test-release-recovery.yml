name: Test release recovery

on:
  pull_request:
    paths:
      - .github/workflows/release-impl.yml
      - .github/workflows/test-release-recovery.yml
      - scripts/test-release-recovery.sh
      - scripts/test-release-develop-sync.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/release-impl.yml
      - .github/workflows/test-release-recovery.yml
      - scripts/test-release-recovery.sh
      - scripts/test-release-develop-sync.sh

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test recovery validation and release notes
        run: bash scripts/test-release-recovery.sh
      - name: Test stable release develop branch sync
        run: bash scripts/test-release-develop-sync.sh
